name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Go paths
        shell: bash
        run: |
          set -euo pipefail
          echo "GOPATH=${HOME}/go" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${HOME}/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=${HOME}/.cache/go-build" >> "$GITHUB_ENV"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"
          mkdir -p "${HOME}/go/bin" "${HOME}/go/pkg/mod" "${HOME}/.cache/go-build"

      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Cache Go (gojq)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
            ${{ env.GOPATH }}/bin
          key: ${{ runner.os }}-gojq-v0.12.16-${{ steps.go.outputs.go-version }}

      - name: Install gojq
        run: |
          set -euo pipefail
          go install github.com/itchyny/gojq/cmd/gojq@v0.12.16

      - name: Verify vendored runtime
        run: |
          set -euo pipefail
          test -x .mcp-bash/bin/mcp-bash
          echo "MCPBASH_HOME=${GITHUB_WORKSPACE}/.mcp-bash" >> "$GITHUB_ENV"

      - name: Install mcp-bash CLI
        run: |
          set -euo pipefail
          unset MCPBASH_HOME
          curl -fsSL https://raw.githubusercontent.com/yaniv-golan/mcp-bash-framework/main/install.sh | bash -s -- --yes
          echo "$HOME/.local/share/mcp-bash/bin" >> "$GITHUB_PATH"

      - name: Validate project
        run: mcp-bash validate

      - name: Install lint dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq shellcheck shfmt

      - name: Run lint
        run: ./test/lint.sh

      - name: Check Markdown local links
        run: python3 ./test/check_doc_links.py
