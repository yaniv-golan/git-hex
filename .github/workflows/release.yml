name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v${TAG} does not match VERSION file (${VERSION})"
            exit 1
          fi

      - name: Verify vendored runtime
        run: |
          set -euo pipefail
          test -x .mcp-bash/bin/mcp-bash
          echo "${GITHUB_WORKSPACE}/.mcp-bash/bin" >> "$GITHUB_PATH"

      - name: Validate project
        run: |
          .mcp-bash/bin/mcp-bash validate

      - name: Create bundle
        run: |
          mcp-bash bundle --verbose --output ./dist

      - name: Verify bundle
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          test -f "dist/git-hex-${VERSION}.mcpb"
          ls -la dist/

      - name: Create release tarball
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          tar -czf "dist/git-hex-v${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='test' \
            --exclude='docs/internal' \
            --exclude='docs/superpowers' \
            --exclude='.DS_Store' \
            .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.mcpb *.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.mcpb
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
